<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MenuSell">
<meta name="mobile-web-app-capable" content="yes">
<title>MenuSell Mobile Calculator</title>
<style>
  :root {
    --bg: #0f0f0f;
    --card: #1a1a1a;
    --accent: #00c853;
    --text: #ffffff;
    --muted: #aaaaaa;
    --border: #333;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
  }
  h1 { font-size: 1.4rem; margin-bottom: 16px; text-align: center; }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
  }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
  input, select {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #222;
    color: var(--text);
    font-size: 1rem;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #000;
    font-weight: bold;
    font-size: 1rem;
    margin-top: 8px;
  }
  .result {
    font-size: 1.8rem;
    font-weight: bold;
    color: var(--accent);
    text-align: center;
    margin: 12px 0;
  }
  .small { font-size: 0.9rem; color: var(--muted); text-align: center; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .addon { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .addon input[type="number"] { flex: 1; margin-bottom: 0; }
  .addon input[type="text"] { flex: 2; margin-bottom: 0; }
  .packages { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pkg {
    background: #222;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
    border: 1px solid var(--border);
  }
  .pkg.active { border-color: var(--accent); }
  .pkg .price { font-size: 1.2rem; font-weight: bold; color: var(--accent); }
</style>
</head>
<body>
<h1>MenuSell Calculator</h1>

<div class="card">
  <label>Vehicle Price ($)</label>
  <input type="number" id="price" value="45000" step="100">
  <div class="small" style="margin: -8px 0 12px; text-align: left; font-size: 0.75rem;">+$5,000 A/C allowance added automatically</div>
  
  <label>Trade-in Value ($)</label>
  <input type="number" id="trade" value="0" step="100">
  
  <label>Deposit / Cash Down ($)</label>
  <input type="number" id="deposit" value="0" step="100">
  
  <div class="row">
    <div>
      <label>Interest Rate (%)</label>
      <input type="number" id="rate" value="7.5" step="0.1">
    </div>
    <div>
      <label>Term (months)</label>
      <input type="number" id="term" value="60" step="12">
    </div>
  </div>
  
  <label>Balloon / Residual (%)</label>
  <input type="number" id="balloon" value="0" step="5" min="0" max="50">
</div>

<div class="card">
  <label>Add-on Products</label>
  <div id="addons">
    <div class="addon">
      <input type="text" placeholder="e.g. Warranty" value="Warranty" class="addon-name">
      <input type="number" placeholder="Price" value="1500" class="addon-price" step="50">
    </div>
    <div class="addon">
      <input type="text" placeholder="e.g. Paint Protection" value="Paint Protection" class="addon-name">
      <input type="number" placeholder="Price" value="800" class="addon-price" step="50">
    </div>
  </div>
  <button onclick="addAddon()">+ Add Product</button>
</div>

<button onclick="calculate()">Calculate Payments</button>

<div id="results" class="card" style="display:none;">
  <div class="small">Amount Financed</div>
  <div class="result" id="financed">$0</div>
  
  <div class="packages" id="packages"></div>
  
  <div class="small" style="margin-top:12px;" id="summary"></div>
</div>

<script>
function addAddon() {
  const div = document.createElement('div');
  div.className = 'addon';
  div.innerHTML = `
    <input type="text" placeholder="Product name" class="addon-name">
    <input type="number" placeholder="Price" value="0" class="addon-price" step="50">
  `;
  document.getElementById('addons').appendChild(div);
}

function pmt(annualRate, nper, pv, fv = 0) {
  if (annualRate === 0) return (pv - fv) / nper;
  const r = annualRate / 12 / 100;
  const pvif = Math.pow(1 + r, nper);
  // Correct formula for balloon: payment so that remaining balance after nper = fv
  return (pv - fv / pvif) * r / (1 - Math.pow(1 + r, -nper));
}

function calculate() {
  let price = parseFloat(document.getElementById('price').value) || 0;
  // Automatically add $5,000 A/C allowance in the background
  price += 5000;
  const trade = parseFloat(document.getElementById('trade').value) || 0;
  const deposit = parseFloat(document.getElementById('deposit').value) || 0;
  const rate = parseFloat(document.getElementById('rate').value) || 0;
  const term = parseInt(document.getElementById('term').value) || 60;
  const balloonPct = parseFloat(document.getElementById('balloon').value) || 0;

  const baseAmount = Math.max(0, price - trade - deposit);
  const balloon = baseAmount * (balloonPct / 100);

  // Collect addons
  const names = Array.from(document.querySelectorAll('.addon-name')).map(el => el.value.trim() || 'Add-on');
  const prices = Array.from(document.querySelectorAll('.addon-price')).map(el => parseFloat(el.value) || 0);
  const activeAddons = names.map((n, i) => ({name: n, price: prices[i]})).filter(a => a.price > 0);

  // Packages: Base, and combinations (for simplicity, show base + each single + all)
  const packages = [
    { name: 'Base', addons: [], extra: 0 }
  ];
  activeAddons.forEach(a => {
    packages.push({ name: a.name, addons: [a], extra: a.price });
  });
  if (activeAddons.length > 1) {
    packages.push({ 
      name: 'All Products', 
      addons: activeAddons, 
      extra: activeAddons.reduce((s, a) => s + a.price, 0) 
    });
  }

  const resultsEl = document.getElementById('results');
  const packagesEl = document.getElementById('packages');
  packagesEl.innerHTML = '';

  packages.forEach((pkg, idx) => {
    const amount = baseAmount + pkg.extra;
    const balloonAmt = amount * (balloonPct / 100);
    const monthly = pmt(rate, term, amount, balloonAmt);
    const totalInterest = (monthly * term) - (amount - balloonAmt);
    
    const div = document.createElement('div');
    div.className = 'pkg' + (idx === 0 ? ' active' : '');
    div.innerHTML = `
      <div style="font-size:0.8rem; color:#aaa;">${pkg.name}</div>
      <div class="price">$${monthly.toFixed(2)}</div>
      <div style="font-size:0.75rem; color:#aaa;">/month</div>
      ${pkg.extra ? `<div style="font-size:0.7rem; margin-top:4px;">+$${pkg.extra.toFixed(0)}</div>` : ''}
    `;
    packagesEl.appendChild(div);
  });

  document.getElementById('financed').textContent = '$' + baseAmount.toLocaleString();
  document.getElementById('summary').innerHTML = `
    Rate: ${rate}% • ${term} months • Balloon: ${balloonPct}%<br>
    Tap a package to focus (base shown highlighted)
  `;
  resultsEl.style.display = 'block';
  resultsEl.scrollIntoView({ behavior: 'smooth' });
}

// Initial calc
calculate();
</script>

<div class="small" style="margin-top: 24px; padding: 0 8px; text-align: center; color: #888; font-size: 0.75rem; line-height: 1.4;">
  Payments are for estimate quote purposes only and will differ based on your profile.
</div>

</body>
</html>
